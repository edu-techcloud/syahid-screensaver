<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensaver TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{--ink:#fff;--ink2:rgba(255,255,255,.86);--gold:#ffe7a8;
  --ar:"Aref Ruqaa","Amiri","Noto Naskh Arabic","Droid Arabic Naskh","Scheherazade New","Traditional Arabic",serif}
[data-phase=dawn]{--tint:96,64,150;--acc:255,197,138;--m1:#7a6a9c;--m2:#51457a;--m3:#2e2a50;--mq:#1f1c38;--sun:#ffd29a;--cl:#ffd6c0;--clo:.45;--lake:#8a79b0;--dn1:#b88a8a;--dn2:#9a6a78;--dn3:#6a4660;--pal:#2a2448;--glw:.35}
[data-phase=day]{--tint:18,88,128;--acc:255,224,138;--m1:#6aaed0;--m2:#34906c;--m3:#1f6b4f;--mq:#f3f1e4;--sun:#fff6c8;--cl:#ffffff;--clo:.7;--lake:#4fa8c4;--dn1:#e9c27d;--dn2:#d9a85e;--dn3:#b8843f;--pal:#1f5a3a;--glw:.12}
[data-phase=dusk]{--tint:122,50,96;--acc:255,179,122;--m1:#9a4f80;--m2:#5f325e;--m3:#2f1b3c;--mq:#201232;--sun:#ffb36b;--cl:#ffb89a;--clo:.5;--lake:#b0587a;--dn1:#c76a58;--dn2:#9a4a50;--dn3:#5a2f45;--pal:#2a1636;--glw:.7}
[data-phase=night]{--tint:10,48,70;--acc:255,217,138;--m1:#124050;--m2:#0b2c3a;--m3:#061b26;--mq:#04121a;--sun:#ffb36b;--cl:#5a7a96;--clo:.22;--lake:#0a3040;--dn1:#1d3a4a;--dn2:#12303c;--dn3:#0a1e28;--pal:#04121a;--glw:1}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw/80)}
body{width:100vw;height:100vh;overflow:hidden;background:#020812;color:var(--ink);
  font-family:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;cursor:none}

/* ===== Latar sinematik ===== */
.bg{position:fixed;inset:0;overflow:hidden}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 4s}
[data-phase=dawn] .s-dawn,[data-phase=day] .s-day,[data-phase=dusk] .s-dusk,[data-phase=night] .s-night{opacity:1}
.s-dawn{background:radial-gradient(circle at 0 0,rgba(255,160,110,.55),transparent 40%),radial-gradient(circle at 100% 0,rgba(170,120,255,.45),transparent 40%),radial-gradient(circle at 100% 100%,rgba(255,120,150,.4),transparent 38%),linear-gradient(#2b2a5e,#7a5aa6 40%,#ff9a76 75%,#ffd29a)}
.s-day{background:radial-gradient(circle at 0 0,rgba(255,236,150,.5),transparent 40%),radial-gradient(circle at 100% 0,rgba(120,220,255,.5),transparent 40%),radial-gradient(circle at 0 100%,rgba(120,255,190,.35),transparent 38%),linear-gradient(#1c7fd1,#5bb6f0 55%,#c4ecff)}
.s-dusk{background:radial-gradient(circle at 0 0,rgba(255,110,70,.55),transparent 40%),radial-gradient(circle at 100% 0,rgba(190,80,200,.5),transparent 40%),radial-gradient(circle at 100% 100%,rgba(255,150,80,.4),transparent 38%),linear-gradient(#2a1f55,#9b3f7a 45%,#ff6f4a 78%,#ffb36b)}
.s-night{background:radial-gradient(circle at 0 0,rgba(70,90,230,.5),transparent 40%),radial-gradient(circle at 100% 0,rgba(140,70,220,.45),transparent 40%),radial-gradient(circle at 100% 100%,rgba(20,170,170,.35),transparent 38%),linear-gradient(#020812,#06223a 60%,#0e4a52)}
.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.07}
.scene{position:absolute;inset:0;width:100%;height:100%}
.scene *{transition:fill 4s,opacity 4s,transform 4s}
.sc{opacity:0;transition:opacity 3s}
[data-scene="1"] .sc1,[data-scene="2"] .sc2,[data-scene="3"] .sc3{opacity:1}
#sun,#moon,#stars,.lit{opacity:0}
[data-phase=dawn] #sun{opacity:1;transform:translate(850px,730px)}
[data-phase=day] #sun{opacity:1;transform:translate(960px,690px)}
[data-phase=dusk] #sun{opacity:1;transform:translate(1080px,730px)}
[data-phase=night] #sun{transform:translate(960px,1000px)}
#moon{transform:translate(1040px,760px)}
[data-phase=night] #moon{opacity:1;transform:translate(1040px,668px)}
[data-phase=night] #stars,[data-phase=night] .lit{opacity:1}
.sunc{fill:var(--sun)}.cl{fill:var(--cl);opacity:var(--clo)}
.m1{fill:var(--m1)}.m2{fill:var(--m2)}.m3{fill:var(--m3)}.mq{fill:var(--mq)}
.dn1{fill:var(--dn1)}.dn2{fill:var(--dn2)}.dn3{fill:var(--dn3)}.lake{fill:var(--lake)}
.lant{position:absolute;left:0;top:0;width:100%;height:12%;pointer-events:none}
.glw{opacity:var(--glw)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,transparent 58%,rgba(0,0,0,.38));pointer-events:none}

/* ===== Susun atur ===== */
.stage{position:relative;height:100%;padding:.5rem 2.6rem 1rem;display:grid;gap:.8rem;
  grid-template-columns:1fr 19rem 1fr;grid-template-rows:auto auto auto 1fr;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.stage,.stage *{font-weight:700;letter-spacing:0}
.glass{background-color:rgba(var(--tint),.6);background-image:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,0) 50%,rgba(0,0,0,.14));
  border:1px solid rgba(var(--acc),.42);border-radius:1.4rem;transition:background-color 4s,border-color 4s;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 .5rem 1.6rem rgba(0,0,0,.22);padding:.8rem 1.4rem;min-width:0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background-color:rgba(10,24,40,.82)}}

.bis{grid-column:1 / span 3;text-align:center;font-family:var(--ar);font-size:2.8rem;line-height:1.2;color:var(--gold);
  text-shadow:0 0 .8rem rgba(255,226,160,.5),0 .08rem .25rem rgba(0,0,0,.6)}

.clock{grid-column:1;display:flex;flex-direction:column;justify-content:center}
.time{font-size:5.6rem;line-height:1;white-space:nowrap}
.time small{font-size:2.2rem;color:var(--ink2);margin-left:.5rem}
.date{font-size:1.85rem;margin-top:.45rem}
.hijri{font-size:1.4rem;color:rgb(var(--acc));min-height:1.5rem;transition:color 4s}

.weather{grid-column:2 / span 2;display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
.now .ic{font-size:2.9rem;line-height:1}
.now .t{font-size:4rem;line-height:1}
.now .ds{font-size:1.3rem;color:var(--ink2);line-height:1.15}
.right{position:relative;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.rv{transition:opacity .6s}
#rvA{display:flex;flex-direction:column;gap:.7rem}
#rvB{position:absolute;inset:0;opacity:0;pointer-events:none;display:flex;flex-direction:column;gap:.45rem}
.right.hv #rvA,.right.hv.sw #rvB{opacity:0}
.right.hv #rvB{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:.3rem .35rem}
.chip{background:rgba(255,255,255,.18);border-radius:.7rem;padding:.15rem .6rem;font-size:1.15rem;white-space:nowrap}
.chip span{color:var(--ink2)}
.chip.wet{background:rgba(90,170,255,.5)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.day{text-align:center;background:rgba(255,255,255,.14);border-radius:.9rem;padding:.35rem .1rem;font-size:1.15rem}
.day .dn{font-size:1.3rem}
.day .di{font-size:1.9rem;line-height:1.1;margin:.05rem 0}
.day .dr{color:var(--ink2);font-size:1.05rem}
.rain{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hours{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:.3rem .4rem;min-height:0}
.hr{background:rgba(255,255,255,.16);border-radius:.8rem;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:1.1rem;line-height:1.05;min-width:0;overflow:hidden;white-space:nowrap}
.hr .e{font-size:1.35rem;line-height:1}
.hr.w1{background:rgba(90,170,255,.45)}.hr.w2{background:rgba(60,130,255,.75)}

.prayer{grid-column:1 / span 3;position:relative;display:flex;align-items:center;gap:1.4rem;padding:.5rem 1.4rem 1.1rem}
.next{min-width:17rem}
.next .lbl{font-size:1.2rem;color:var(--ink2)}
.next .nm{font-size:2.3rem;line-height:1.1;color:rgb(var(--acc));transition:color 4s}
.next .cd{font-size:1.7rem;color:var(--ink2)}
.rows{flex:1;display:flex;gap:.4rem}
.row{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:.25rem .1rem;border-radius:1rem;font-size:1.3rem;border:1px solid transparent;min-width:0;white-space:nowrap}
.row em{font-style:normal;font-size:1.5rem;margin-right:.15rem}
.row b{font-size:1.7rem}
.row.on{background:rgba(var(--acc),.34);border-color:rgba(var(--acc),.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.row.past{opacity:.6}
.src{position:absolute;right:1.4rem;bottom:.3rem;font-size:1.05rem;color:var(--ink2)}
.live{font-size:1.05rem;color:var(--ink2)}
.live i{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#5dd68a;margin-right:.4rem}
.live.off i{background:#ff8a6a}

.hadith{grid-column:1;grid-row:4;display:flex;flex-direction:column;overflow:hidden;align-self:start;height:100%}
.hl{display:flex;justify-content:space-between;font-size:1.15rem;color:var(--ink2)}
.fade{transition:opacity .6s}
.hbody{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.ar{font-family:var(--ar);direction:rtl;text-align:center;color:var(--gold);line-height:1.6;padding:.1rem 0}
.ar.l{font-size:2.2rem}.ar.m{font-size:1.6rem}.ar.s{font-size:1.2rem}
.ms{text-align:center;font-size:1.15rem;line-height:1.2;color:#fff}
.sep{height:1px;background:rgba(255,255,255,.3);margin:.35rem 0}
.aar{font-family:var(--ar);direction:rtl;text-align:center;font-size:1.3rem;line-height:1.5;color:var(--gold)}
.ams{text-align:center;font-size:1rem;color:var(--ink2)}
.ar,.aar{text-shadow:0 0 .8rem rgba(255,226,160,.3),0 .08rem .25rem rgba(0,0,0,.6)}

.mon{grid-column:3;grid-row:4;display:flex;flex-direction:column;height:100%;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:1.25rem;margin-bottom:.25rem}
.mg{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:.2rem 1.2rem}
.m{min-width:0}
.m .k{font-size:.95rem;color:var(--ink2)}
.m .v{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .sub{font-size:.85rem;color:var(--ink2);white-space:nowrap}
.bar{height:.28rem;border-radius:1rem;background:rgba(255,255,255,.24);margin-top:.2rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:rgb(var(--acc));border-radius:1rem;transition:width 1s}

/* ===== Foto keluarga: panel tengah untuk TV 16:9 ===== */
.family-photo{grid-column:2;grid-row:4;position:relative;min-width:0;min-height:0;height:100%;overflow:hidden;
  padding:.45rem;display:flex;align-items:stretch;justify-content:center;
  border:1px solid rgba(var(--acc),.58);border-radius:1.4rem;
  background:rgba(5,12,20,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 .5rem 1.6rem rgba(0,0,0,.3)}
.family-photo img{display:block;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 62%;
  border-radius:1rem;filter:saturate(1.04) contrast(1.02)}
/* Animasi tipografi ringan: terapung perlahan dan cahaya berdenyut, CSS sahaja */
.family-love{position:absolute;top:1.1rem;left:.7rem;right:.7rem;z-index:2;text-align:center;
  font-family:"Caveat","Segoe Print",cursive;font-size:clamp(1.5rem,2.8vw,2.65rem);
  font-weight:900;line-height:1.15;color:#fff4c7;letter-spacing:.075em;pointer-events:none;
  text-shadow:0 0 7px rgba(255,220,120,.95),0 0 20px rgba(255,150,70,.7),0 3px 18px rgba(0,0,0,.95);
  animation:storyFloat 8s ease-in-out infinite,storyGlow 3.8s ease-in-out infinite,storyShimmer 6s linear infinite}
.family-love .story-main{display:block;background:linear-gradient(100deg,#fff4c7 0%,#fff 22%,#ffd36b 42%,#fff 58%,#fff4c7 78%,#fff 100%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.family-love .story-sub{display:block;margin-top:.28rem;font-family:system-ui,sans-serif;font-size:clamp(.58rem,1.05vw,.9rem);
  font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#fff8df;text-shadow:0 2px 10px rgba(0,0,0,.95)}
@keyframes storyFloat{0%,100%{transform:translate3d(0,0,0) rotate(-1deg) scale(1)}
  25%{transform:translate3d(0,7px,0) rotate(.8deg) scale(1.025)}
  50%{transform:translate3d(0,-2px,0) rotate(1deg) scale(1.04)}
  75%{transform:translate3d(0,-7px,0) rotate(-.5deg) scale(1.015)}}
@keyframes storyGlow{0%,100%{opacity:.82;text-shadow:0 0 7px rgba(255,220,120,.8),0 0 16px rgba(255,150,70,.55),0 3px 18px rgba(0,0,0,.95)}
  50%{opacity:1;text-shadow:0 0 12px rgba(255,245,190,1),0 0 30px rgba(255,170,80,.95),0 3px 18px rgba(0,0,0,.95)}}
@keyframes storyShimmer{0%{background-position:200% center}100%{background-position:-20% center}}
@media(prefers-reduced-motion:reduce){.family-love{animation:none;opacity:1}}
</style>
</head>

var sun={rise:7,set:19};
function updatePhase(d){
  var t=d.getHours()+d.getMinutes()/60, p;
  if(t>=sun.rise-.7 && t<sun.rise+2.5) p='dawn';
  else if(t>=sun.rise+2.5 && t<sun.set-2) p='day';
  else if(t>=sun.set-2 && t<sun.set+.7) p='dusk';
  else p='night';
  if(document.body.getAttribute('data-phase')!==p) document.body.setAttribute('data-phase',p);
}

var P=null;
var NAMES=[['Fajr','Subuh','🌅'],['Sunrise','Syuruk','🌄'],['Dhuha','Dhuha','☀️'],['Dhuhr','Zohor','🌞'],['Asr','Asar','🌤️'],['Maghrib','Maghrib','🌇'],['Isha','Isyak','🌃']];
function dkey(d){ return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear(); }
function addMin(hhmm,m){ var a=hhmm.split(':'), t=(+a[0])*60+(+a[1])+m; return pad(Math.floor(t/60)%24)+':'+pad(t%60); }
function hijriMs(s){ var m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s||''); return m? (+m[3])+' '+(HMON[+m[2]-1]||'')+' '+m[1]+' H' : ''; }
function fromJakim(j){
  var t=j.prayerTime && j.prayerTime[0];
  if(!t || !t.fajr || !t.dhuhr || !t.isha) throw new Error('jakim');
  var c=function(x){ return String(x).slice(0,5); }, o={times:{},hijri:hijriMs(t.hijri),src:'JAKIM e-Solat · Taiping (PRK06)'};
  o.times.Fajr=c(t.fajr); o.times.Sunrise=c(t.syuruk); o.times.Dhuha=t.dhuha?c(t.dhuha):addMin(c(t.syuruk),28);
  o.times.Dhuhr=c(t.dhuhr); o.times.Asr=c(t.asr); o.times.Maghrib=c(t.maghrib); o.times.Isha=c(t.isha);
  return o;
}
function fromAladhan(j){
  var t=j.data.timings, h=j.data.date.hijri, o={times:{},src:'Kaedah JAKIM · Taiping (sandaran)',hijri:h.day+' '+(HMON[+h.month.number-1]||h.month.en)+' '+h.year+' H'};
  var c=function(x){ return String(x).slice(0,5); };
  o.times.Fajr=c(t.Fajr); o.times.Sunrise=c(t.Sunrise); o.times.Dhuha=addMin(c(t.Sunrise),28);
  o.times.Dhuhr=c(t.Dhuhr); o.times.Asr=c(t.Asr); o.times.Maghrib=c(t.Maghrib); o.times.Isha=c(t.Isha);
  return o;
}
function savePrayer(o,k){ o.key=k; o.at=hm(new Date()); P=o; store.set('prayer2',o); renderPrayer(); }
function loadPrayer(){
  var d=new Date(), k=dkey(d)+'|'+CFG.zone, c=store.get('prayer2');
  if(c && c.key===k){ P=c; renderPrayer(); }
  fetch('https://www.e-solat.gov.my/index.php?r=esolatApi/TakwimSolat&period=today&zone='+CFG.zone)
    .then(function(r){ return r.json(); })
    .then(function(j){ savePrayer(fromJakim(j),k); })
    .catch(function(){
      fetch('https://api.aladhan.com/v1/timings/'+dkey(d)+'?latitude='+CFG.lat+'&longitude='+CFG.lon+'&method='+CFG.method)
        .then(function(r){ return r.json(); })
        .then(function(j){ savePrayer(fromAladhan(j),k); })
        .catch(function(){
          if(!P) $('nextCd').textContent='Tiada internet';
          else { $('psrc').className='live off src'; $('psrc').innerHTML='<i></i>Offline · guna data tersimpan '+P.at; }
        });
    });
}
function pdate(s,base){ var a=s.split(':'), x=new Date(base); x.setHours(+a[0],+a[1],0,0); return x; }
function fmt12(s){ var a=s.split(':'), h=+a[0]; return pad(h%12||12)+':'+a[1]+(h<12?' pg':' ptg'); }
function renderPrayer(){
  if(!P) return;
  $('hijri').textContent=P.hijri;
  $('rows').innerHTML=NAMES.map(function(n){
    return '<div class="row" data-k="'+n[0]+'"><span><em>'+n[2]+'</em>'+n[1]+'</span><b>'+fmt12(P.times[n[0]])+'</b></div>';
  }).join('');
  $('psrc').className='live src';
  $('psrc').innerHTML='<i></i>Langsung · '+P.src+' · '+P.at;
  updateNext(new Date());
}
function updateNext(now){
  if(!P) return;
  var next=null, i, t;
  for(i=0;i<NAMES.length;i++){ t=pdate(P.times[NAMES[i][0]],now); if(t>now){ next=[NAMES[i],t]; break; } }
  if(!next){ var tm=new Date(now); tm.setDate(tm.getDate()+1); next=[NAMES[0],pdate(P.times.Fajr,tm)]; }
  var s=Math.max(0,Math.floor((next[1]-now)/1000));
  $('nextName').textContent=next[0][2]+' '+next[0][1]+'  '+fmt12(P.times[next[0][0]]);
  $('nextCd').textContent='dalam '+pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
  var rows=document.querySelectorAll('.row');
  for(i=0;i<rows.length;i++){
    var k=rows[i].getAttribute('data-k'), pt=pdate(P.times[k],now);
    var cls='row'+(k===next[0][0]?' on':'')+(pt<=now?' past':'');
    if(rows[i].className!==cls) rows[i].className=cls;
  }
  if(now.getHours()===0 && now.getMinutes()===1 && now.getSeconds()<2) loadPrayer();
}

var lastW='--:--', HH=null, D5=null, ciG=0;
var WC={0:['☀️','Cerah'],1:['🌤️','Kebanyakan cerah'],2:['⛅','Separa mendung'],3:['☁️','Mendung'],45:['🌫️','Berkabus'],48:['🌫️','Berkabus'],
51:['🌦️','Gerimis'],53:['🌦️','Gerimis'],55:['🌧️','Gerimis lebat'],61:['🌧️','Hujan ringan'],63:['🌧️','Hujan'],65:['🌧️','Hujan lebat'],

function wc(c){ return WC[c]||['🌡️','—']; }
function wic(c,day){ if(!day&&(c===0||c===1)) return '🌙'; if(!day&&c===2) return '☁️'; return wc(c)[0]; }
function lab(h){ return (h%12||12)+' '+(h<12?'PG':'PTG'); }
function hourOf(i){ return +HH.time[i].slice(11,13); }
function wetAt(i){ return HH.precipitation_probability[i]>=50 || HH.precipitation[i]>=0.3; }
function dayRange(d){ var s=-1,e=-1,i; for(i=0;i<HH.time.length;i++){ if(HH.time[i].slice(0,10)===D5[d]){ if(s<0) s=i; e=i; } } return [s,e]; }
function blocks(i0,i1){
  var out=[], i=i0;
  while(i<=i1){
    if(wetAt(i)){
      var s=i, mp=0, pi=i, mm=0;
      while(i<=i1 && wetAt(i)){ var p=HH.precipitation_probability[i]; if(p>mp){ mp=p; pi=i; } mm+=HH.precipitation[i]; i++; }
      out.push({s:s,e:i-1,mp:mp,pi:pi,mm:mm});
    } else i++;
  }
  return out;
}
function rainText(d){
  var r=dayRange(d), i0=d===0?Math.max(r[0],ciG):r[0], bl=blocks(i0,r[1]);
  if(!bl.length) return {w:false,short:d===0?'tiada lagi hari ini':'tiada',full:'💧 '+(d===0?'Tiada hujan lagi hari ini':'Tiada hujan dijangka')};
  var b=bl[0], endL=lab((hourOf(b.e)+1)%24), now=(d===0&&b.s===i0), rng=lab(hourOf(b.s))+' – '+endL;
  return {w:true,
    short:now?'kini hingga '+endL:rng,
    full:'💧 Hujan '+(now?'sekarang, reda ±'+endL:rng)+' · puncak '+b.mp+'% · ±'+b.mm.toFixed(1)+' mm'+(bl.length>1?' · +'+(bl.length-1)+' lagi':'')};
}
function dayName(d){ return d===0?'Hari ini':d===1?'Esok':DAYS[new Date(D5[d]+'T12:00:00').getDay()]; }
function buildHourView(d){
  var r=dayRange(d), h='', k, q, pr, cls;
  for(k=0;k<12;k++){
    if(d===0){ q=ciG+k; if(q>=HH.time.length) break; pr=HH.precipitation_probability[q]; }
    else { q=r[0]+k*2; if(q+1>r[1]) break; pr=Math.max(HH.precipitation_probability[q],HH.precipitation_probability[q+1]); }
    cls=pr>=70?' w2':(pr>=50?' w1':'');
    h+='<div class="hr'+cls+'"><div><span class="e">'+wic(HH.weather_code[q],HH.is_day[q])+'</span> '+(d===0&&k===0?'Kini':lab(hourOf(q)))+'</div><div>'+Math.round(HH.temperature_2m[q])+'° · '+pr+'%</div></div>';
  }
  $('rainTxt').textContent=dayName(d)+' · '+rainText(d).full;
  $('hours').innerHTML=h;
}

    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'+
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset'+
    '&timezone='+encodeURIComponent(CFG.tz)+'&forecast_days=5';
  fetch(u).then(function(r){return r.json();}).then(function(j){
    var c=j.current, d=j.daily, w=wc(c.weather_code), i;
    HH=j.hourly; D5=d.time; ciG=0;
    while(ciG<HH.time.length-1 && HH.time[ciG].slice(0,13)<c.time.slice(0,13)) ciG++;
    sun.rise=hrs(d.sunrise[0])||7; sun.set=hrs(d.sunset[0])||19; updatePhase(new Date());
    lastW=hm(new Date());
    var rt=rainText(0);
    $('wIc').textContent=wic(c.weather_code,HH.is_day[ciG]); $('wT').textContent=Math.round(c.temperature_2m)+'°';
    $('wDs').innerHTML=w[1]+' · '+CFG.city+'<br><span class="live"><i></i>Langsung '+lastW+'</span>';
    $('chips').innerHTML=
      '<div class="chip"><span>Terasa </span>'+Math.round(c.apparent_temperature)+'°</div>'+
      '<div class="chip"><span>Lembap </span>'+c.relative_humidity_2m+'%</div>'+
      '<div class="chip"><span>Angin </span>'+Math.round(c.wind_speed_10m)+' km/j</div>'+
      '<div class="chip'+(rt.w?' wet':'')+'"><span>Hujan </span>'+rt.short+'</div>'+
      '<div class="chip"><span>UV </span>'+Math.round(d.uv_index_max[0])+'</div>'+
      '<div class="chip">🌅 '+d.sunrise[0].slice(11)+' · 🌇 '+d.sunset[0].slice(11)+'</div>';
    var h='';
    for(i=0;i<5;i++){
      var dt=new Date(d.time[i]+'T12:00:00'), x=wc(d.weather_code[i]);
      h+='<div class="day"><div class="dn">'+(i===0?'Hari ini':DAYS[dt.getDay()].slice(0,3))+'</div><div class="di">'+x[0]+'</div>'+
        '<div>'+Math.round(d.temperature_2m_max[i])+'° <span class="dr">'+Math.round(d.temperature_2m_min[i])+'°</span></div>'+
        '<div class="dr">💧'+d.precipitation_probability_max[i]+'%</div></div>';
    }
    $('days').innerHTML=h;
    var R=document.querySelector('.right'), cur=viewSeq[vi];
    if(R.classList.contains('hv') && cur!=='A') buildHourView(cur); else if(vi===0) buildHourView(0);
  }).catch(function(){
    if(!$('chips').innerHTML) $('wDs').textContent='Cuaca: tiada internet';
    else $('wDs').innerHTML+='<br><span class="live off"><i></i>Gagal kemas kini</span>';
  });
}
/* Pusingan paparan: 5 hari -> setiap jam hari ini -> esok -> ... */
var viewSeq=['A',0,1,2,3,4], vi=0;
function stepView(){
  if(!HH) return;
  vi=(vi+1)%viewSeq.length;
  var v=viewSeq[vi], R=document.querySelector('.right');
  if(v==='A'){ R.classList.remove('hv'); R.classList.remove('sw'); }
  else if(R.classList.contains('hv')){ R.classList.add('sw'); setTimeout(function(){ buildHourView(v); R.classList.remove('sw'); },650); }
  else { buildHourView(v); R.classList.add('hv'); }
}

/* ---------- Hadis sahih (30) & ayat / zikir ---------- */
var hi=new Date().getDate()%HADITH.length, ai=new Date().getDate()%AYAT.length;
function fitHadith(){
  var hb=$('hb'), ar=$('har'), ms=$('hms'), n=0;
  ar.style.fontSize=''; ms.style.fontSize='';
  var a=parseFloat(getComputedStyle(ar).fontSize), m=parseFloat(getComputedStyle(ms).fontSize);
  while(hb.scrollHeight>hb.clientHeight+1 && n<60){
    if(a>16){ a-=1; ar.style.fontSize=a+'px'; } else if(m>12){ m-=1; ms.style.fontSize=m+'px'; } else break; n++;
  }
}
function showHadith(first){
  var h=HADITH[hi], n=h[0].length, el=$('har');
  function set(){
    el.textContent=h[0]; el.className='ar '+(n<=45?'l':n<=95?'m':'s');
    $('hms').textContent=h[1]; $('hsrc').textContent='HR '+h[2];
    $('hlab').textContent='Hadis Sahih '+(hi+1)+' / '+HADITH.length;
    $('hb').style.opacity=1; fitHadith();
  }
  if(first){ set(); } else { $('hb').style.opacity=0; setTimeout(set,650); }
  hi=(hi+1)%HADITH.length;
}
function showAyat(first){
  var a=AYAT[ai];
  function set(){ $('aar').textContent=a[0]; $('ams').textContent=a[1]+' ('+a[2]+')'; $('ab').style.opacity=1; }
  if(first){ set(); } else { $('ab').style.opacity=0; setTimeout(set,650); }
  ai=(ai+1)%AYAT.length;
}

/* ---------- Monitor sistem (bacaan sebenar daripada pelayar TV) ---------- */
var fps=0, frames=0, last=performance.now(), t0=Date.now(), sto={u:0,q:0};
(function loop(){ frames++; var n=performance.now(); if(n-last>=1000){ fps=Math.round(frames*1000/(n-last)); frames=0; last=n; } requestAnimationFrame(loop); })();
var CELLS=[['fps','Prestasi paparan',1],['mem','Memori halaman',1],['cpu','CPU / RAM TV',0],['net','Rangkaian',1],
           ['sto','Storan pelayar',1],['scr','Skrin',0],['sys','Pelayar & Android',0],['up','Masa jalan',0]];
(function(){
  var h='';
  CELLS.forEach(function(c){ h+='<div class="m"><div class="k">'+c[1]+'</div><div class="v" id="v_'+c[0]+'">-</div>'+
    (c[2]?'<div class="bar"><i id="b_'+c[0]+'"></i></div>':'<div class="sub" id="s_'+c[0]+'">&nbsp;</div>')+'</div>'; });
  $('mg').innerHTML=h;
})();
function setC(id,v,pct,sub){ $('v_'+id).textContent=v; if(pct!=null){ $('b_'+id).style.width=Math.max(0,Math.min(100,pct))+'%'; } if(sub!=null && $('s_'+id)) $('s_'+id).textContent=sub; }
function mb(x){ return Math.round(x/1048576); }
function readStorage(){ try{ if(navigator.storage&&navigator.storage.estimate) navigator.storage.estimate().then(function(e){ sto.u=e.usage||0; sto.q=e.quota||0; }); }catch(e){} }
function updateMon(){
  var nav=navigator, pm=performance.memory, con=nav.connection||{}, ua=nav.userAgent||'';
  setC('fps',fps+' FPS',fps/60*100);
  if(pm) setC('mem',mb(pm.usedJSHeapSize)+' / '+mb(pm.jsHeapSizeLimit)+' MB',pm.usedJSHeapSize/pm.jsHeapSizeLimit*100); else setC('mem','tidak disokong',0);
  setC('cpu',(nav.hardwareConcurrency||'?')+' teras · ~'+(nav.deviceMemory||'?')+' GB RAM',null,'RAM: anggaran');
  if(nav.onLine) setC('net',(con.effectiveType||'online').toUpperCase()+(con.downlink?' · '+con.downlink+' Mbps':'')+(con.rtt?' · '+con.rtt+' ms':''),con.downlink?con.downlink/50*100:50);
  else setC('net','Offline',0);
  setC('sto',sto.q?mb(sto.u)+' / '+mb(sto.q)+' MB':'tidak disokong',sto.q?Math.max(1,sto.u/sto.q*100):0);
  setC('scr',window.innerWidth+'×'+window.innerHeight,null,'DPR '+(window.devicePixelRatio||1)+'x');
  var c=/Chrome\/(\d+)/.exec(ua), a=/Android[ ]?([\d.]+)/.exec(ua);
  setC('sys',(c?'Chrome '+c[1]:'Pelayar')+' · '+(a?'Android '+a[1]:'TV'),null,'Pelayar skrin ini');
  var m=Math.floor((Date.now()-t0)/60000);
  setC('up',Math.floor(m/60)+'j '+(m%60)+'m',null,'Cuaca '+lastW+' · Solat '+(P?P.at:'--:--'));
}

/* ---------- Kekal hidup & mula ---------- */
try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
document.addEventListener('visibilitychange',function(){ try{ if(!document.hidden&&navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} });

showHadith(true); showAyat(true);
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitHadith); }catch(e){}
tickClock(); loadPrayer(); loadWeather(); readStorage(); updateMon();
setInterval(tickClock,1000);
setInterval(updateMon,4000);
setInterval(readStorage,30000);
setInterval(loadWeather,15*60*1000);
setInterval(loadPrayer,60*60*1000);
setInterval(stepView,18000);
setInterval(function(){ showHadith(false); },30000);
setInterval(function(){ showAyat(false); },45000);
</script>
