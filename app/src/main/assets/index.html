<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensaver TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{--ink:#fff;--ink2:rgba(255,255,255,.78);--glass:rgba(8,24,40,.36);--edge:rgba(255,255,255,.22);--gold:#ffe7a8;
  --ar:"Aref Ruqaa","Amiri","Noto Naskh Arabic","Droid Arabic Naskh","Scheherazade New","Traditional Arabic",serif}
[data-phase=dawn]{--m1:#7a6a9c;--m2:#51457a;--m3:#2e2a50;--mq:#1f1c38;--sun:#ffd29a;--cl:#ffd6c0;--clo:.45}
[data-phase=day]{--m1:#6aaed0;--m2:#34906c;--m3:#1f6b4f;--mq:#f3f1e4;--sun:#fff6c8;--cl:#ffffff;--clo:.7}
[data-phase=dusk]{--m1:#9a4f80;--m2:#5f325e;--m3:#2f1b3c;--mq:#201232;--sun:#ffb36b;--cl:#ffb89a;--clo:.5}
[data-phase=night]{--m1:#124050;--m2:#0b2c3a;--m3:#061b26;--mq:#04121a;--sun:#ffb36b;--cl:#5a7a96;--clo:.22}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw/80)}
body{width:100vw;height:100vh;overflow:hidden;background:#020812;color:var(--ink);
  font-family:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;cursor:none}

/* Latar */
.bg{position:fixed;inset:0;overflow:hidden}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 4s}
[data-phase=dawn] .s-dawn,[data-phase=day] .s-day,[data-phase=dusk] .s-dusk,[data-phase=night] .s-night{opacity:1}
.s-dawn{background:linear-gradient(#2b2a5e,#7a5aa6 40%,#ff9a76 75%,#ffd29a)}
.s-day{background:linear-gradient(#1c7fd1,#5bb6f0 55%,#c4ecff)}
.s-dusk{background:linear-gradient(#2a1f55,#9b3f7a 45%,#ff6f4a 78%,#ffb36b)}
.s-night{background:linear-gradient(#020812,#06223a 60%,#0e4a52)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.scene *{transition:fill 4s,opacity 4s,transform 4s}
#sun,#moon,#stars,#lit{opacity:0}
[data-phase=dawn] #sun{opacity:1;transform:translate(850px,730px)}
[data-phase=day] #sun{opacity:1;transform:translate(960px,590px)}
[data-phase=dusk] #sun{opacity:1;transform:translate(1080px,730px)}
[data-phase=night] #sun{transform:translate(960px,1000px)}
#moon{transform:translate(960px,640px)}
[data-phase=night] #moon{opacity:1;transform:translate(960px,590px)}
[data-phase=night] #stars,[data-phase=night] #lit{opacity:1}
.sunc{fill:var(--sun)}.cl{fill:var(--cl);opacity:var(--clo)}
.m1{fill:var(--m1)}.m2{fill:var(--m2)}.m3{fill:var(--m3)}.mq{fill:var(--mq)}

/* Susun atur */
.stage{position:relative;height:100%;padding:.5rem 2.6rem 1rem;display:grid;gap:.8rem;
  grid-template-columns:1fr 19rem 1fr;grid-template-rows:auto auto auto 1fr}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:1.4rem;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 .5rem 1.6rem rgba(0,0,0,.18);padding:.8rem 1.4rem;min-width:0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(10,24,40,.7)}}

.bis{grid-column:1 / span 3;text-align:center;font-family:var(--ar);font-size:2.7rem;line-height:1.2;color:var(--gold);
  text-shadow:0 0 1.2rem rgba(255,226,160,.55),0 .1rem .3rem rgba(0,0,0,.5)}

.clock{grid-column:1;display:flex;flex-direction:column;justify-content:center}
.time{font-size:5.2rem;font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.time small{font-size:1.7rem;font-weight:300;color:var(--ink2);letter-spacing:0;margin-left:.5rem}
.date{font-size:1.4rem;font-weight:500;margin-top:.45rem}
.hijri{font-size:1.05rem;color:var(--ink2);margin-top:.1rem;min-height:1.3rem}

.weather{grid-column:2 / span 2;display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
.now .ic{font-size:2.8rem;line-height:1}
.now .t{font-size:3.3rem;font-weight:200;line-height:1}
.now .ds{font-size:1rem;color:var(--ink2);line-height:1.35}
.right{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:rgba(255,255,255,.14);border-radius:.7rem;padding:.25rem .7rem;font-size:.95rem;white-space:nowrap}
.chip span{color:var(--ink2)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.day{text-align:center;background:rgba(255,255,255,.1);border-radius:.9rem;padding:.4rem .1rem;font-size:.95rem}
.day .dn{font-weight:600}
.day .di{font-size:1.5rem;margin:.05rem 0}
.day .dr{color:var(--ink2);font-size:.85rem}

.prayer{grid-column:1 / span 3;position:relative;display:flex;align-items:center;gap:1.6rem;padding:.5rem 1.6rem 1.1rem}
.next{min-width:18rem}
.next .lbl{font-size:.95rem;color:var(--ink2)}
.next .nm{font-size:1.9rem;font-weight:600;line-height:1.15}
.next .cd{font-size:1.3rem;font-variant-numeric:tabular-nums;font-weight:300;color:var(--ink2)}
.rows{flex:1;display:flex;gap:.5rem}
.row{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:.3rem .2rem;border-radius:1rem;font-size:1.1rem}
.row b{font-size:1.4rem;font-weight:400;font-variant-numeric:tabular-nums}
.row.on{background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);font-weight:600}
.row.past{opacity:.55}
.src{position:absolute;right:1.6rem;bottom:.35rem;font-size:.8rem;color:var(--ink2)}
.live{font-size:.85rem;color:var(--ink2)}
.live i{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#5dd68a;margin-right:.4rem}
.live.off i{background:#ff8a6a}

/* Hadis */
.hadith{grid-column:1;grid-row:4;display:flex;flex-direction:column;overflow:hidden;align-self:start;height:100%}
.hl{display:flex;justify-content:space-between;font-size:.9rem;color:var(--ink2)}
.fade{transition:opacity .6s}
.hbody{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.ar{font-family:var(--ar);direction:rtl;text-align:center;color:var(--gold);line-height:1.6;padding:.1rem 0}
.ar.l{font-size:2.2rem}.ar.m{font-size:1.6rem}.ar.s{font-size:1.25rem}
.ms{text-align:center;font-size:.95rem;line-height:1.35;color:#fff}
.sep{height:1px;background:rgba(255,255,255,.22);margin:.35rem 0}
.aar{font-family:var(--ar);direction:rtl;text-align:center;font-size:1.3rem;line-height:1.5;color:var(--gold)}
.ams{text-align:center;font-size:.8rem;color:var(--ink2)}

/* Monitor */
.mon{grid-column:3;grid-row:4;display:flex;flex-direction:column;height:100%;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:1rem;font-weight:600;margin-bottom:.35rem}
.mg{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:.3rem 1.2rem}
.m{min-width:0}
.m .k{font-size:.75rem;color:var(--ink2)}
.m .v{font-size:.98rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .sub{font-size:.7rem;color:var(--ink2);white-space:nowrap}
.bar{height:.28rem;border-radius:1rem;background:rgba(255,255,255,.2);margin-top:.2rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:1rem;transition:width 1s}

/* ===== Tulisan: tebal gaya tulisan tangan ===== */
.stage,.stage *{font-weight:700;letter-spacing:0}
.stage{line-height:1.1;text-shadow:0 .08rem .3rem rgba(0,0,0,.35)}
.time{font-size:5.6rem}.time small{font-size:2.2rem}
.date{font-size:1.85rem}.hijri{font-size:1.4rem}
.now .t{font-size:4rem}.now .ds{font-size:1.3rem}
.chip{font-size:1.2rem}
.day{font-size:1.15rem}.day .dn{font-size:1.3rem}.day .dr{font-size:1.05rem}
.next .lbl{font-size:1.2rem}.next .nm{font-size:2.4rem}.next .cd{font-size:1.7rem}
.row{font-size:1.4rem}.row b{font-size:1.75rem}
.src,.live{font-size:1.05rem}
.hl{font-size:1.15rem}
.ms{font-size:1.15rem;line-height:1.2}.ams{font-size:1rem}
.ar,.aar,.bis{text-shadow:0 0 .8rem rgba(255,226,160,.35),0 .08rem .25rem rgba(0,0,0,.45)}
.bis{font-size:2.8rem}
.ar.l{font-size:2.2rem}.ar.m{font-size:1.6rem}.ar.s{font-size:1.2rem}.aar{font-size:1.3rem}
.mh{font-size:1.3rem}
.m .k{font-size:1rem}.m .v{font-size:1.2rem}.m .sub{font-size:.9rem}
.next{min-width:19rem}
</style>
</head>

  <div class="bis" lang="ar" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>

function tickClock(){
  var d=new Date(), h=d.getHours();

  $('sec').textContent=pad(d.getSeconds())+(h<12?' PG':' PTG');

/* ---------- Pagi / siang / petang / malam (auto) ---------- */
var sun={rise:7,set:19};
function updatePhase(d){
  var t=d.getHours()+d.getMinutes()/60, p;
  if(t>=sun.rise-.7 && t<sun.rise+2.5) p='dawn';
  else if(t>=sun.rise+2.5 && t<sun.set-2) p='day';
  else if(t>=sun.set-2 && t<sun.set+.7) p='dusk';
  else p='night';
  if(document.body.getAttribute('data-phase')!==p) document.body.setAttribute('data-phase',p);
}
function hrs(iso){ var m=/T(\d\d):(\d\d)/.exec(iso||''); return m? (+m[1])+(+m[2])/60 : null; }

/* ---------- Waktu solat (Aladhan, kaedah JAKIM) ---------- */
var P=null, NAMES=[['Fajr','Subuh'],['Sunrise','Syuruk'],['Dhuhr','Zohor'],['Asr','Asar'],['Maghrib','Maghrib'],['Isha','Isyak']];
function dkey(d){ return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear(); }
function loadPrayer(){
  var d=new Date(), k=dkey(d), c=store.get('prayer');
  if(c && c.key===k){ P=c; renderPrayer(); }
  fetch('https://api.aladhan.com/v1/timings/'+k+'?latitude='+CFG.lat+'&longitude='+CFG.lon+'&method='+CFG.method)
    .then(function(r){return r.json();})
    .then(function(j){
      var t=j.data.timings, o={at:hm(new Date()),key:k,times:{},hijri:j.data.date.hijri.day+' '+j.data.date.hijri.month.en+' '+j.data.date.hijri.year+' H'};
      NAMES.forEach(function(n){ o.times[n[0]]=String(t[n[0]]).slice(0,5); });
      P=o; store.set('prayer',o); renderPrayer();
    }).catch(function(){
      if(!P) $('nextCd').textContent='Tiada internet';
      else { $('psrc').className='live off src'; $('psrc').innerHTML='<i></i>Offline · guna data tersimpan '+P.at; }
    });
}
function pdate(s,base){ var a=s.split(':'), x=new Date(base); x.setHours(+a[0],+a[1],0,0); return x; }
function fmt12(s){ var a=s.split(':'), h=+a[0]; return pad(h%12||12)+':'+a[1]+(h<12?' pg':' ptg'); }
function renderPrayer(){
  if(!P) return;
  $('hijri').textContent=P.hijri;
  $('rows').innerHTML=NAMES.map(function(n){
    return '<div class="row" data-k="'+n[0]+'"><span>'+n[1]+'</span><b>'+fmt12(P.times[n[0]])+'</b></div>';
  }).join('');
  $('psrc').className='live src';
  $('psrc').innerHTML='<i></i>Langsung · JAKIM · '+CFG.city+' · '+P.at;
  updateNext(new Date());
}
function updateNext(now){
  if(!P) return;
  var next=null, i, t;
  for(i=0;i<NAMES.length;i++){ t=pdate(P.times[NAMES[i][0]],now); if(t>now){ next=[NAMES[i],t]; break; } }
  if(!next){ var tm=new Date(now); tm.setDate(tm.getDate()+1); next=[NAMES[0],pdate(P.times.Fajr,tm)]; }
  var s=Math.max(0,Math.floor((next[1]-now)/1000));
  $('nextName').textContent=next[0][1]+'  '+fmt12(P.times[next[0][0]]);
  $('nextCd').textContent='dalam '+pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
  var rows=document.querySelectorAll('.row');
  for(i=0;i<rows.length;i++){
    var k=rows[i].getAttribute('data-k'), pt=pdate(P.times[k],now);
    var cls='row'+(k===next[0][0]?' on':'')+(pt<=now?' past':'');
    if(rows[i].className!==cls) rows[i].className=cls;
  }
  if(now.getHours()===0 && now.getMinutes()===1 && now.getSeconds()<2) loadPrayer();
}

/* ---------- Hadis sahih (30) & ayat / zikir ---------- */
var hi=new Date().getDate()%HADITH.length, ai=new Date().getDate()%AYAT.length;
function fitHadith(){
  var hb=$('hb'), ar=$('har'), ms=$('hms'), n=0;
  ar.style.fontSize=''; ms.style.fontSize='';
  var a=parseFloat(getComputedStyle(ar).fontSize), m=parseFloat(getComputedStyle(ms).fontSize);
  while(hb.scrollHeight>hb.clientHeight+1 && n<60){
    if(a>16){ a-=1; ar.style.fontSize=a+'px'; } else if(m>12){ m-=1; ms.style.fontSize=m+'px'; } else break; n++;
  }
}
function showHadith(first){
  var h=HADITH[hi], n=h[0].length, el=$('har');
  function set(){
    el.textContent=h[0]; el.className='ar '+(n<=45?'l':n<=95?'m':'s');
    $('hms').textContent=h[1]; $('hsrc').textContent='HR '+h[2];
    $('hlab').textContent='Hadis Sahih '+(hi+1)+' / '+HADITH.length;
    $('hb').style.opacity=1; fitHadith();
  }
  if(first){ set(); } else { $('hb').style.opacity=0; setTimeout(set,650); }
  hi=(hi+1)%HADITH.length;
}
function showAyat(first){
  var a=AYAT[ai];
  function set(){ $('aar').textContent=a[0]; $('ams').textContent=a[1]+' ('+a[2]+')'; $('ab').style.opacity=1; }
  if(first){ set(); } else { $('ab').style.opacity=0; setTimeout(set,650); }
  ai=(ai+1)%AYAT.length;
}

  if(nav.onLine) setC('net',(con.effectiveType||'online').toUpperCase()+(con.downlink?' · '+con.downlink+' Mbps':'')+(con.rtt?' · '+con.rtt+' ms':''),con.downlink?con.downlink/50*100:50);
  else setC('net','Offline',0);
  setC('sto',sto.q?mb(sto.u)+' / '+mb(sto.q)+' MB':'tidak disokong',sto.q?Math.max(1,sto.u/sto.q*100):0);
  setC('scr',window.innerWidth+'×'+window.innerHeight,null,'DPR '+(window.devicePixelRatio||1)+'x');
  var c=/Chrome\/(\d+)/.exec(ua), a=/Android[ ]?([\d.]+)/.exec(ua);
  setC('sys',(c?'Chrome '+c[1]:'Pelayar')+' · '+(a?'Android '+a[1]:'TV'),null,'Pelayar skrin ini');
  var m=Math.floor((Date.now()-t0)/60000);
  setC('up',Math.floor(m/60)+'j '+(m%60)+'m',null,'Cuaca '+lastW+' · Solat '+(P?P.at:'--:--'));
